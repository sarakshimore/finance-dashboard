openapi: 3.0.3
info:
  title: Finance Dashboard API
  version: 1.0.0
  description: REST API for authentication, RBAC, financial records, dashboard analytics, and admin user management.
servers:
  - url: http://localhost:4000/api/v1

tags:
  - name: Auth
  - name: Users
  - name: Records
  - name: Dashboard

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data: { type: object }
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string }
        details: { type: object }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
    UserCreateRequest:
      type: object
      required: [fullName, email, password, role]
      properties:
        fullName: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        role:
          type: string
          enum: [viewer, admin]
        status:
          type: string
          enum: [active, inactive]
    UserUpdateRequest:
      type: object
      properties:
        fullName: { type: string }
        role:
          type: string
          enum: [viewer, admin]
        status:
          type: string
          enum: [active, inactive]
    RecordCreateRequest:
      type: object
      required: [amount, type, category, date]
      properties:
        amount: { type: number, minimum: 0.01 }
        type:
          type: string
          enum: [income, expense]
        category: { type: string }
        date: { type: string, format: date }
        notes: { type: string, nullable: true }
    RecordUpdateRequest:
      type: object
      properties:
        amount: { type: number, minimum: 0.01 }
        type:
          type: string
          enum: [income, expense]
        category: { type: string }
        date: { type: string, format: date }
        notes: { type: string, nullable: true }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new viewer user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
        '409':
          description: Duplicate email

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user profile
        '401':
          description: Unauthorized

  /users:
    get:
      tags: [Users]
      summary: List users (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User list
        '403':
          description: Forbidden
    post:
      tags: [Users]
      summary: Create user (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by id (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User found
    patch:
      tags: [Users]
      summary: Update user (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Deactivate user (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User deactivated

  /users/{id}/permanent:
    delete:
      tags: [Users]
      summary: Permanently delete user (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User deleted permanently
        '409':
          description: User has linked financial records

  /records:
    get:
      tags: [Records]
      summary: List records (viewer/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [income, expense] }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Record list
    post:
      tags: [Records]
      summary: Create record (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreateRequest'
      responses:
        '201':
          description: Record created

  /records/{id}:
    get:
      tags: [Records]
      summary: Get record by id (viewer/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Record fetched
    patch:
      tags: [Records]
      summary: Update record (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordUpdateRequest'
      responses:
        '200':
          description: Record updated
    delete:
      tags: [Records]
      summary: Soft-delete record (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Record deleted

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Income/expense/net summary (viewer/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Dashboard summary

  /dashboard/category-totals:
    get:
      tags: [Dashboard]
      summary: Category totals (viewer/admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Category totals

  /dashboard/trends:
    get:
      tags: [Dashboard]
      summary: Time trend analytics (viewer/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [monthly, weekly], default: monthly }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Trend data

  /dashboard/recent-activity:
    get:
      tags: [Dashboard]
      summary: Recent record activity (viewer/admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Recent activity list
